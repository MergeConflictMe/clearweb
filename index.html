<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClearWeb — Блокировщик Рекламы</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #121212; color: white; }
        header { background: #1a1a1a; padding: 15px; border-bottom: 2px solid #00ff66; display: flex; gap: 10px; align-items: center; }
        input { flex: 1; padding: 10px; background: #333; border: 1px solid #555; color: white; border-radius: 4px; }
        button { padding: 10px 20px; background: #00ff66; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; }
        button:disabled { background: #555; cursor: not-allowed; }
        #log { margin: 20px; padding: 10px; background: #000; color: #0f0; font-family: monospace; display: none; }
    </style>
</head>
<body>

<header>
    <div style="font-weight:bold; color:#00ff66;">🛡️ ClearWeb</div>
    <input type="text" id="urlInput" placeholder="Введите сайт (например, habr.com)">
    <button onclick="cleanAndOpen()" id="btn">Открыть чисто</button>
</header>

<div id="log"></div>

<script src="engine.js"></script>
</body>
</html>
