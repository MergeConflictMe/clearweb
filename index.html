<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClearWeb — Универсальный Блокировщик</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #121212; }
        
        /* Панель управления */
        #control-panel {
            position: fixed; top: 0; left: 0; width: 100%; height: 75px;
            background: #1a1a1a; color: white; display: flex; align-items: center;
            justify-content: space-between; padding: 0 20px; box-sizing: border-box; z-index: 9999;
            border-bottom: 2px solid #00ff66;
        }
        .logo { font-weight: bold; font-size: 20px; color: #00ff66; text-transform: uppercase; letter-spacing: 1px; }
        .search-box { display: flex; gap: 10px; }
        input { padding: 10px; width: 350px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 4px; font-size: 14px; }
        input:focus { border-color: #00ff66; outline: none; }
        button { padding: 10px 20px; background: #00ff66; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; color: #121212; font-size: 14px; }
        button:hover { background: #00cc52; }
        
        .native-ad-placeholder { width: 300px; height: 50px; background: #222; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #666; border: 1px dashed #444; border-radius: 4px; }

        #output-viewport {
            position: absolute; top: 75px; left: 0; width: 100%; height: calc(100% - 75px);
            border: none; background: white;
        }
    </style>
</head>
<body>

    <div id="control-panel">
        <div class="logo">ClearWeb</div>
        <div class="search-box">
            <input type="text" id="url-field" placeholder="Вставь домен (например, habr.com)">
            <button onclick="processTargetSite()">Открыть чисто</button>
        </div>
        <div class="native-ad-placeholder">Рекламное место (Нативный блок)</div>
    </div>

    <iframe id="output-viewport"></iframe>

    <script src="engine.js"></script>
</body>
</html>
